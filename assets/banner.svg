<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="45%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="0.8" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Styles & Animations -->
    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out 1s infinite; }
      .particle-3 { animation: floatParticle 7s ease-in-out 2s infinite; }
      .flow-line { stroke-dasharray: 6, 6; animation: dashFlow 2.5s linear infinite; }
      .pulse-node { animation: pulseRing 3s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="920" height="280" rx="16" fill="url(#cyberGrid)"/>

  <!-- Border Highlight -->
  <rect width="918" height="278" x="1" y="1" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Dynamic Ambient Background Elements (kept strictly behind text) -->
  <g opacity="0.45">
    <!-- Tunnel Circuit Left -->
    <path class="flow-line" d="M 60 220 L 220 220 L 280 180" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="60" cy="220" r="4" fill="#38bdf8" class="pulse-node"/>
    <circle cx="280" cy="180" r="4" fill="#818cf8"/>

    <!-- Tunnel Circuit Right -->
    <path class="flow-line" d="M 860 220 L 700 220 L 640 180" fill="none" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="860" cy="220" r="4" fill="#ec4899" class="pulse-node"/>
    <circle cx="640" cy="180" r="4" fill="#c084fc"/>

    <!-- Subtle Floating Particles -->
    <circle class="particle-1" cx="120" cy="70" r="3" fill="#38bdf8"/>
    <circle class="particle-2" cx="800" cy="75" r="3.5" fill="#c084fc"/>
    <circle class="particle-3" cx="460" cy="30" r="2.5" fill="#34d399"/>
    <circle class="particle-1" cx="240" cy="50" r="2" fill="#818cf8"/>
    <circle class="particle-2" cx="680" cy="45" r="2" fill="#f43f5e"/>
  </g>

  <!-- Foreground Content: Badge Pills -->
  <g transform="translate(250, 36)">
    <!-- Pill 1: Local Proxy -->
    <g transform="translate(0, 0)">
      <rect width="115" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="22" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Local Proxy</text>
    </g>
    <!-- Pill 2: API Agent -->
    <g transform="translate(125, 0)">
      <rect width="110" height="24" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="12" r="3.5" fill="#818cf8"/>
      <text x="22" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">API Runner</text>
    </g>
    <!-- Pill 3: Tunneling -->
    <g transform="translate(245, 0)">
      <rect width="170" height="24" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="12" r="3.5" fill="#ec4899"/>
      <text x="22" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Private Net Tunneling</text>
    </g>
  </g>

  <!-- Main Title (Strict Foreground) -->
  <text x="460" y="112" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5" filter="url(#neonGlow)">
    Awesome Local API Agent &amp; Proxy Runner
  </text>
  <text x="460" y="112" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5">
    Awesome Local API Agent &amp; Proxy Runner
  </text>

  <!-- Subtitle (Strict Foreground) -->
  <text x="460" y="146" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Curated Hub of Localhost Gateways, Webhook Relays, Reverse Proxies &amp; API Mock Runtimes
  </text>

  <!-- Visual Feature Cards / Bottom Highlights -->
  <g transform="translate(60, 185)">
    <!-- Card 1 -->
    <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">⚡</text>
    <text x="42" y="23" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Localhost Expose</text>
    <text x="42" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">ngrok, Localtunnel, frp</text>

    <!-- Card 2 -->
    <g transform="translate(205, 0)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">🕵️</text>
      <text x="42" y="23" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Traffic Interception</text>
      <text x="42" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">mitmproxy, Charles, Fiddler</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(410, 0)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">🧪</text>
      <text x="42" y="23" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Mocking &amp; Testing</text>
      <text x="42" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">WireMock, Mockoon, Bruno</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(615, 0)">
      <rect width="185" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">🛡️</text>
      <text x="42" y="23" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero-Trust Tunnels</text>
      <text x="42" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Cloudflare, Tailscale, Ziti</text>
    </g>
  </g>
</svg>